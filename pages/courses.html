<!DOCTYPE html>
<html>
<head>
<title>Courses</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<!-- Header -->
<header class="bg-blue-600 text-white p-4 flex justify-between">
  <h1 class="text-lg font-bold">Courses</h1>
  <a href="dashboard.html">Back</a>
</header>

<div class="flex">

<!-- Sidebar -->
<div class="w-64 bg-blue-900 text-white h-screen p-4">
  <a href="dashboard.html" class="block py-2 hover:bg-blue-700 px-2 rounded">Dashboard</a>
  <a href="planner.html" class="block py-2 hover:bg-blue-700 px-2 rounded">Planner</a>
  <a href="progress.html" class="block py-2 hover:bg-blue-700 px-2 rounded">Progress</a>
  <a href="chatbot.html" class="block py-2 hover:bg-blue-700 px-2 rounded">Chatbot</a>
  <a href="courses.html" class="block py-2 bg-blue-700 px-2 rounded">Courses</a>
  <a href="contact.html" class="block py-2 hover:bg-blue-700 px-2 rounded">Contact</a>
</div>

<!-- Main Content -->
<div class="p-6 w-full">

  <h2 class="text-2xl font-bold mb-4">Explore Courses 📚</h2>

  <!-- Search -->
  <input id="search" onkeyup="searchCourse()"
    placeholder="Search course..."
    class="border p-2 mb-4 w-full rounded">

  <!-- Filter Buttons -->
  <div class="mb-4 space-x-2">
    <button onclick="filterCategory('All')" class="px-3 py-1 bg-gray-300 rounded">All</button>
    <button onclick="filterCategory('Academic')" class="px-3 py-1 bg-gray-300 rounded">Academic</button>
    <button onclick="filterCategory('Technical')" class="px-3 py-1 bg-gray-300 rounded">Technical</button>
    <button onclick="filterCategory('Skill')" class="px-3 py-1 bg-gray-300 rounded">Skill</button>
  </div>

  <!-- Course Cards -->
  <div id="courseList" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>

</div>

</div>

<script src="../js/courses.js"></script>
</body>
</html>
