<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex justify-center items-center h-screen">

<div class="bg-white p-6 rounded shadow w-80">

  <h2 class="text-xl font-bold mb-4 text-center">Login</h2>

  <input id="email" placeholder="Email" class="border p-2 w-full mb-2">
  <input id="password" type="password" placeholder="Password" class="border p-2 w-full mb-2">

  <button onclick="login()" class="bg-blue-600 text-white w-full py-2 rounded">
    Login
  </button>

  <p id="msg" class="text-red-500 mt-2"></p>

  <p class="mt-3 text-center">
    Don't have account?
    <a href="signup.html" class="text-blue-600">Signup</a>
  </p>

</div>

<script src="../js/login.js"></script>
</body>
</html>
