<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SmartStudy AI</title>
 <link rel="icon" sizes="32x32" href="https://i.ibb.co/N2Z36tWh/colorful-logo-with-words-study-study-it-1205884-1582.jpg">
 
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="./../css/login.css">

  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
</head>

<body>


<header class="header">
  <div class="header-inner">

    <!-- LOGO + TEXT SAME LINE -->
    <div class="logo-box">
      <img src="https://i.ibb.co/N2Z36tWh/colorful-logo-with-words-study-study-it-1205884-1582.jpg">
      <h1>SmartStudy AI</h1>
    </div>

    <!-- BACK BUTTON -->
    <a href="./../index.html" class="back-btn">
      ⬅ Home
    </a>

  </div>
</header>

<!-- LOGIN BOX -->
<div class="login-wrapper">

  <div class="login-card">

    <!-- LOGO -->
    <div class="logo">📘 SmartStudy AI</div>
    <p class="title">Login to your account</p>

    <input id="email" type="email" placeholder="Email">

    <div class="pass-box">
      <input id="password" type="password" placeholder="Password">
      <button onclick="togglePass()">👁</button>
    </div>

    <!-- CAPTCHA -->
    <div class="captcha-box">
      <span id="captchaText"></span>
      <button onclick="generateCaptcha()">🔄</button>
    </div>

    <input id="captchaInput" placeholder="Enter captcha">

    <button class="login-btn" onclick="login()">Login</button>

    <div class="links">
      <a href="#" onclick="showResetBox()"">Forgot Password?</a>
      <a href="./signup.html">Create Account</a>
    </div>

  </div>

</div>
<!-- RESET PASSWORD POPUP -->
<div id="resetBox" class="reset-box hidden">

  <div class="reset-card">

    <h2>🔐 Reset Password</h2>

    <input id="resetEmail" type="email" placeholder="Enter Email">
    <input id="newPassword" type="password" placeholder="New Password">

    <button onclick="resetPassword()">Reset Password</button>
    <button onclick="closeResetBox()" class="cancel">Cancel</button>

  </div>

</div>
<script src="./../js/login.js"></script>

</body>
</html>
