<!DOCTYPE html>
<html>
<head>
<title>Signup</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex justify-center items-center h-screen">

<div class="bg-white p-6 rounded shadow w-80">

  <h2 class="text-xl font-bold mb-4 text-center">Signup</h2>

  <input id="name" placeholder="Name" class="border p-2 w-full mb-2">
  <input id="email" placeholder="Email" class="border p-2 w-full mb-2">
  <input id="password" type="password" placeholder="Password" class="border p-2 w-full mb-2">

  <button onclick="signup()" class="bg-blue-600 text-white w-full py-2 rounded">
    Signup
  </button>

  <p id="msg" class="text-green-600 mt-2"></p>

</div>

<script src="../js/signup.js"></script>
</body>
</html>
