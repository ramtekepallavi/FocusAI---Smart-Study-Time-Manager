<!DOCTYPE html>
<html>
<head>
<title>Contact</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<header class="bg-blue-600 text-white p-4 flex justify-between">
  <h1>Contact</h1>
  <a href="dashboard.html">Back</a>
</header>

<div class="flex">

<div class="w-64 bg-blue-900 text-white h-screen p-4">
  <a href="dashboard.html" class="block py-2">Dashboard</a>
  <a href="planner.html" class="block py-2">Planner</a>
  <a href="progress.html" class="block py-2">Progress</a>
  <a href="chatbot.html" class="block py-2">Chatbot</a>
  <a href="courses.html" class="block py-2">Courses</a>
</div>

<div class="p-6 w-full">

  <h2 class="text-xl font-bold mb-4">Contact Us</h2>

  <input id="name" placeholder="Your Name" class="border p-2 w-full mb-2">
  <input id="email" placeholder="Your Email" class="border p-2 w-full mb-2">
  <textarea id="message" placeholder="Message" class="border p-2 w-full mb-2"></textarea>

  <button onclick="sendMessage()" class="bg-blue-600 text-white px-4 py-2 rounded">
    Send
  </button>

  <p id="response" class="mt-3 text-green-600"></p>

</div>

</div>

<script src="../js/contact.js"></script>
</body>
</html>
