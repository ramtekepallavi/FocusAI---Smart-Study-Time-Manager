<!DOCTYPE html>
<html>
<head>
<title>AI Chatbot</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<!-- Header -->
<header class="bg-blue-600 text-white p-4 flex justify-between">
  <h1>AI Chatbot</h1>
  <a href="dashboard.html">Back</a>
</header>

<div class="flex">

<!-- Sidebar -->
<div class="w-64 bg-blue-900 text-white h-screen p-4">
  <a href="dashboard.html" class="block py-2">Dashboard</a>
  <a href="planner.html" class="block py-2">Planner</a>
  <a href="progress.html" class="block py-2">Progress</a>
  <a href="chatbot.html" class="block py-2">Chatbot</a>
</div>

<!-- Chat Area -->
<div class="flex-1 p-6 flex flex-col">

  <div id="chatBox" class="bg-white p-4 rounded shadow h-[400px] overflow-y-scroll"></div>

  <div class="mt-4 flex">
    <input id="userInput" placeholder="Ask something..."
      class="border p-2 flex-1 rounded">
    <button onclick="sendMessage()"
      class="bg-blue-600 text-white px-4 ml-2 rounded">
      Send
    </button>
  </div>

</div>

</div>

<script src="../js/chatbot.js"></script>
</body>
</html>
