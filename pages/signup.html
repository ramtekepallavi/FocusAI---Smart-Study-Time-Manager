<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SmartStudy AI</title>

  <link rel="icon" sizes="32x32"
    href="https://i.ibb.co/N2Z36tWh/colorful-logo-with-words-study-study-it-1205884-1582.jpg">

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="./../css/signup.css">

  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
</head>

<body>

<!-- ================= HEADER ================= -->
<header class="header"> <div class="logo-box">
      <img src="https://i.ibb.co/N2Z36tWh/colorful-logo-with-words-study-study-it-1205884-1582.jpg">
      <h1>SmartStudy AI</h1>
    </div>

    <div class="nav-actions">
      <a href="./../index.html" class="back-btn">⬅ Home</a>
    </div>

  </div>
</header>

<!-- ================= SIGNUP ================= -->
<div class="signup-wrapper">

  <div class="signup-card">

    <div class="logo">📘 Create Account</div>
    <p class="title">Join SmartStudy AI 🚀</p>

    <input id="name" type="text" placeholder="Full Name">
    <input id="email" type="email" placeholder="Email">

    <input id="password" type="password" placeholder="Password">
    <input id="confirmPassword" type="password" placeholder="Confirm Password">

    <label class="terms">
      <input id="terms" type="checkbox">
      I agree to Terms & Conditions
    </label>

    <button class="signup-btn" onclick="signup()">Signup</button>

    <p class="bottom-text">
      Already have an account?
      <a href="./login.html">Login here</a>
    </p>

  </div>

</div>

<script src="../js/signup.js"></script>

</body>
</html>
