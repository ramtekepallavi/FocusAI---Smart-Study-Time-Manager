<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Signup - SmartStudy AI</title>

  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E📘%3C/text%3E%3C/svg%3E">

  <!-- ❌ REMOVE Tailwind (conflict fix) -->
  <!-- <script src="https://cdn.tailwindcss.com"></script> -->

  <link rel="stylesheet" href="../css/signup.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
</head>

<body>

<!-- ================= HEADER ================= -->
<header class="header">
  <div class="header-inner">

    <h1>📘 SmartStudy AI</h1>

    <div class="nav-actions">
      <a href="./../index.html" class="back-btn">⬅ Home</a>
      <a href="./login.html" class="login-link">Login</a>
    </div>

  </div>
</header>

<!-- ================= SIGNUP ================= -->
<div class="signup-wrapper">

  <div class="signup-card">

    <div class="logo">📘 Create Account</div>
    <p class="title">Join SmartStudy AI 🚀</p>

    <input type="text" placeholder="Full Name">
    <input type="email" placeholder="Email">

    <input type="password" placeholder="Password">
    <input type="password" placeholder="Confirm Password">

    <label class="terms">
      <input type="checkbox">
      I agree to Terms & Conditions
    </label>

    <button class="signup-btn">Signup</button>

    <p class="bottom-text">
      Already have an account?
      <a href="#">Login here</a>
    </p>

  </div>

</div>

</body>
</html>
